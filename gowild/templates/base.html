<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}GoWild Finder{% endblock %}</title>
<style>
:root { --bg:#f7f8f6; --card:#fff; --ink:#1d2421; --muted:#66706b; --line:#dde2de;
  --green:#1f7a4d; --green-bg:#dff3e7; --gold:#9a6a00; --gold-bg:#fff1c9; --gray-bg:#eceeed; --red:#b3261e; --red-bg:#fbe3e1; }
@media (prefers-color-scheme: dark) { :root { --bg:#141816; --card:#1c211f; --ink:#e7ece9; --muted:#9aa49f; --line:#2e3532;
  --green:#6fd3a0; --green-bg:#173a28; --gold:#f0c34f; --gold-bg:#3b3014; --gray-bg:#262c29; --red:#ff8a80; --red-bg:#3d1d1b; } }
* { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.5 system-ui, sans-serif }
header { display:flex; gap:20px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card); flex-wrap:wrap }
header b { font-size:21px } header a { color:var(--muted); text-decoration:none } header a.on { color:var(--ink); font-weight:600 }
main { max-width:1200px; margin:0 auto; padding:16px }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px }
h1 { font-size:28px; margin:4px 0 14px } h2 { font-size:21px; margin:0 0 10px }
.muted { color:var(--muted) } a { color:var(--green) }
table { width:100%; border-collapse:collapse } th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top }
th { color:var(--muted); font-weight:500; font-size:15px }
input, select { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink) }
button, .btn { font:inherit; padding:9px 16px; border-radius:8px; border:1px solid var(--green); background:var(--green); color:#fff; cursor:pointer; text-decoration:none; display:inline-block }
.btn.big { padding:12px 22px; font-weight:600 } button:disabled { opacity:.6; cursor:default } button.ghost { background:transparent; color:var(--muted); border-color:var(--line) }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:end } .row label { display:flex; flex-direction:column; font-size:15px; color:var(--muted); gap:3px }
.pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:14px; font-weight:600 }
.pill.gw { background:var(--green-bg); color:var(--green) } .pill.early { background:var(--gold-bg); color:var(--gold) }
.months { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:24px }
.cal { width:100% } .cal td, .cal th { text-align:center; padding:0; border:none; height:44px; font-size:16px }
.cal td span { display:block; margin:2px; border-radius:8px; line-height:38px }
.d-gowild span { background:var(--green-bg); color:var(--green); font-weight:700 }
.d-early span { background:var(--gold-bg); color:var(--gold); font-weight:700 }
.d-blackout span { background:var(--gray-bg); color:var(--muted); text-decoration:line-through }
.d-none span { color:var(--muted) } .d-unchecked span { color:var(--ink); opacity:.5 } .d-out span { opacity:.25 }
.d-problem span { background:var(--red-bg); color:var(--red) }
.legend { display:flex; gap:16px; flex-wrap:wrap; font-size:15px; margin-bottom:10px } .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:4px; vertical-align:-1px }
.stats { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px }
.stat { border:1px solid var(--line); border-radius:8px; padding:10px } .stat b { display:block; font-size:28px }
pre { white-space:pre-wrap; font-size:14px; background:var(--bg); padding:8px; border-radius:6px; max-height:260px; overflow:auto }
.scroll { overflow-x:auto }
</style>
</head>
<body>
<header><b>GoWild Finder</b>
  <a href="{{ url_for('index') }}" class="{{ 'on' if request.endpoint in ('index','show_search') }}">Saved searches</a>
  <a href="{{ url_for('tomorrow') }}" class="{{ 'on' if request.endpoint == 'tomorrow' }}">Fly tomorrow</a>
  <a href="{{ url_for('pass_value') }}" class="{{ 'on' if request.endpoint == 'pass_value' }}">Pass value &amp; trips</a>
  <span class="muted" style="margin-left:auto">{{ pass_name }} pass</span>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
